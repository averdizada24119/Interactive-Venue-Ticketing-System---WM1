<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Purchase Tickets</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="seatmap.css" />
  </head>

  <body> 
    <header>
      <h1>Opera House Hall</h1>
      <h2>Carmen - G. Bizet</h2>
    </header>

    <div id='categories'>
      <h3>Categories</h3>
      <p id="premium-cat">Premium (120$) </p>
      <p id="vip-cat">VIP (85$)</p>
      <p id="standard-cat">Standard (60$)</p>
      <p id="balcony-cat">Balcony (35$)</p>
    </div>

    <hr>

    <div id='main'>
      
      <div id='seat-map'>
        <h2>Seats</h2>

        <div id="controls">
          <button id="zoom-in">Zoom In</button>
          <button id="zoom-out">Zoom Out</button>

          <button id="move-up">Move Up</button>
          <button id="move-down">Move Down</button>
          <button id="move-left">Move Left</button>
          <button id="move-right">Move Right</button>

          <button id="reset-view">Reset View</button>
        </div>

        <div id="viewport">
          <div id="map">
            <p id='stage'>Stage</p>

            <div class='seats'>
            <div id='premium-seat'></div>
            <div id='vip-seat'></div>
            <div id='standard-seat'></div>
            <div id='balcony-seat'></div>
            </div>
          </div>
          
          <div id="navigation-pad">
            <button id="nav-up">↑</button>
            <div class="nav-middle">
              <button id="nav-left">←</button>
              <button id="nav-reset">⌂</button>
              <button id="nav-right">→</button>
            </div>
            <button id="nav-down">↓</button>
            <div class="nav-zoom">
              <button id="nav-zoom-in">+</button>
              <button id="nav-zoom-out">−</button>
            </div>
          </div>
        </div>
      </div>

      <div id="right-side">

        <div id='details'>
          <h3>Seat Details</h3>
          <p id='category'>Category: </p>
          <p id='price'>Price: </p>
          <p id='row'>Row: </p>
          <p id='column'>Seat: </p>
          <button id="add-btn">Add to Cart</button>
        </div>

        <div id='cart'>
          <h3>Your Cart</h3> 
          <div id='items'> </div>
          <h4>Total: <span id="total">$0</span></h4>
          <button id="purchase-btn">Purchase</button>
        </div>
      </div>

      <div id="left-side">
        <div id="states">
          <h3>Seat States</h3>
          <p id="available" style="background: var(--available);">Available</p>
          <p id="inspected" style="background: var(--inspected);">Currently Inspected</p>
          <p id="in-cart" style='background: var(--incart);'>In Cart</p>
          <p id="unavailable" style="background: var(--unavailable);">Unavailable</p>
        </div>
      </div>

    </div>
    
  <script src="script.js"></script>
  <script src="controls.js"></script>  
  </body>
</html>
