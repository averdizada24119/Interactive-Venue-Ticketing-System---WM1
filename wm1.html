<!DOCTYPE html>
<html>
  
  <head>
    <title>Purchase Tickets</title>
    <link rel="stylesheet" href="wm1.css" />
  </head>

  <body>
    <header>
      <h1>Opera House Hall</h1>
      <h2>Carmen - G. Bizet</h2>
      <hr>
      <h3>Categories</h3>
    </header>

    <div id='categories'>
      <p>Premium (120$) </p>
      <p>VIP (85$)</p>
      <p>Standard (60$)</p>
      <p>Balcony (35$)</p>
    </div>

    <hr>

    <div id='main'>
      
      <div id='seats'>
        <h2>Seats</h2>

        <div id="controls">
          <button>Zoom In</button>
          <button>Zoom Out</button>

          <button>Move Up</button>
          <button>Move Down</button>
          <button>Move Left</button>
          <button>Move Right</button>

          <button>Reset View</button>
        </div>

        <hr>

        <p id='stage'>Stage</p>

        <div class='seats'>
        <div id='premium-seat'></div>
        <div id='vip-seat'></div>
        <div id='standard-seat'></div>
        <div id='balcony-seat'></div>
        </div>

      </div>



      <div id="right-side">

        <div id='details'>
          <h3>Seat Details</h3>
          <p id='category'>Category: </p>
          <p id='price'>Price: </p>
          <p id='row'>Row: </p>
          <p id='column'>Seat: </p>
          <button id="add-btn">Add</button>
        </div>

        <div id='cart'>
          <h3>Your Cart</h3> 
          <div id='items'> </div>
          <h4>Total: <span id="total">$0</span></h4>
          <button>Purchase</button>
        </div>

      </div>
    </div>
    
  <script src="wm1.js"></script>  
  </body>
</html>
